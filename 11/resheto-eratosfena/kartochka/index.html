<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Решето Эратосфена и поиск простых чисел — карточка в тетрадь</title>
<meta name="robots" content="noindex">
<style>
@page{size:A4 landscape;margin:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f2f3f7}
body{font:9.5pt/1.3 "Segoe UI",system-ui,sans-serif;color:#1b1b1f}

/* лист: 297x210 мм, две карточки A5 книжной ориентации рядом */
.sheet{width:297mm;height:210mm;margin:0 auto;background:#fff;
       display:flex;position:relative}
.card{width:148.5mm;height:210mm;padding:7mm 7mm 5mm;
      display:flex;flex-direction:column;overflow:hidden}

/* линия разреза — ровно посередине листа */
.sheet::after{content:"";position:absolute;left:148.5mm;top:0;bottom:0;
              border-left:1px dashed #b9bece}

header{border-bottom:2px solid #1f5fa8;padding-bottom:2.5mm;margin-bottom:3mm}
.klass{display:block;font-size:.78em;letter-spacing:.09em;
       text-transform:uppercase;color:#5c6070;margin-bottom:1mm}
h1{font-size:1.5em;line-height:1.15;margin:0;color:#1f5fa8}
.sub{margin:1.5mm 0 0;font-size:.85em;color:#5c6070}

.body{flex:1 1 auto;min-height:0}
.body h3{font-size:1em;margin:2.2mm 0 .8mm;color:#1f5fa8}
.body h3:first-child{margin-top:0}
.body p{margin:1mm 0}
.body ol,.body ul{margin:1mm 0;padding-left:5mm}
.body li{margin:.6mm 0}
.body pre{margin:1.2mm 0;padding:1.2mm 1.8mm;background:#f6f7fb;
          border:1px solid #d9dce6;border-radius:1.5mm;
          font:.88em/1.25 Consolas,"Courier New",monospace;
          white-space:pre-wrap}
.body code{font:.9em/1.3 Consolas,"Courier New",monospace;
           background:#f6f7fb;border:1px solid #d9dce6;
           border-radius:1mm;padding:0 .8mm}
/* Шаблон программы приходит картинкой (см. `template-as-image`). Ширину
   ей задавать нельзя: карточка узкая, и по ширине картинка вылезет за
   низ листа. Держим по высоте, ширина подстроится сама.

   Потолок в 68 мм подобран не на глаз: картинка съедает высоту, которой
   потом не хватает тексту, и автоподбор кегля уводит конспект в нечитаемые
   6–7 пунктов. При 68 мм и текст, и код держатся около 8 — как на
   карточках без картинки. */
.body img{display:block;max-width:100%;max-height:68mm;width:auto;
          margin:1.5mm auto;border-radius:1.5mm}

      <h1>Решето Эратосфена и поиск простых чисел</h1>
      <p class="sub">Обзорный практикум по содержанию ФГОС к пятнадцатой паре 11 класса</p>
    </header>
    <div class="body">
<h3>Простые числа</h3>
  <p><b>Простое</b> число — натуральное число больше 1, у которого ровно два
     делителя: 1 и само число. Остальные числа больше 1 — <b>составные</b>.
     Число 1 ни простое, ни составное. 2 — единственное чётное простое.
     Простых чисел бесконечно много (Евклид), но с ростом чисел они
     встречаются всё реже. <b>Близнецы</b> — простые p и p + 2: 11 и 13,
     17 и 19.</p>

  <h3>Проверка делителями до √n</h3>
  <p>Если n = a·b и оба множителя больше √n, то a·b &gt; n. Значит, у
     составного n есть делитель d, для которого 1 &lt; d ≤ √n, и проверять
     делители дальше √n не нужно: у 97 хватит 2, 3, 5, 7 (11·11 = 121 &gt; 97).</p>

  <h3>Решето Эратосфена</h3>
  <p>Выписываем числа от 2 до N. Берём первое невычеркнутое число p — оно
     простое — и вычёркиваем его кратные. Переходим к следующему
     невычеркнутому, и так далее. Невычеркнутые в конце — ровно простые.</p>
  <ul>
    <li>Кратные p начинаем вычёркивать с <b>p·p</b>: у меньших кратных p·k
        (k &lt; p) есть меньший простой делитель, и они уже вычеркнуты.</li>
    <li>Останавливаемся, когда <b>p·p &gt; N</b>: такой шаг уже ничего не
        вычеркнет. Для N = 100 хватает 2, 3, 5, 7.</li>
    <li>Кратные составного не вычёркиваем — их уже вычеркнул его простой
        делитель. Одно число может вычеркнуться несколько раз: 12 — и как
        кратное 2, и как кратное 3.</li>
  </ul>

  <h3>Сколько стоит решето</h3>
  <p>Шаг p вычёркивает около N/p чисел: от p·p до N с шагом p — это
     ⌊(N − p·p)/p⌋ + 1 вычёркиваний. Всего N/2 + N/3 + N/5 + … — порядка
     <b>N·log log N</b>, чуть больше N. Память — порядка <b>N</b>: по отметке на
     каждое число. Проверка каждого числа делителями до √n — до N·√N
     действий: для N = 100 000 это 2,7 млн делений против 193 тыс.
     вычёркиваний решета. Решето быстрее во много раз, но платит памятью.</p>

  <h3>Простые на отрезке [A; B]</h3>
  <p>Нужны простые p до √B. Для каждого вычёркиваем числа отрезка, кратные
     p, начиная с большего из двух: p·p и первого кратного p, не меньшего A
     (это ⌈A/p⌉·p). Числа, не делящиеся на 2, 3 и 5, повторяются с периодом
     30: в каждых 30 подряд их ровно 8.</p>

<script>
/* Кегль подбирается здесь, а не задаётся в манифесте.
   Причина простая: конспект живёт на странице темы и правится там же,
   а карточка от каждой новой строки становится длиннее. Число,
   подогнанное руками, устареет молча — последние строки уедут под обрез
   карточки и никто этого не заметит до раздачи. Поэтому страница
   уменьшает шрифт сама, пока текст не уложится в высоту A5.
   Запас в 2% — на то, что принтер разложит строки чуть иначе. */
(function (){
  var START = 9.5, FLOOR = 6, STEP = 0.1;
  var tight = false;

  /* Меряем не scrollHeight: блок конспекта растянут на всю свободную
     высоту карточки, и его scrollHeight упирается в clientHeight даже
     когда текста мало, — с таким сравнением шрифт уезжает в минимум.
     Берём низ последнего элемента: он говорит, сколько занято на самом
     деле. */
  function used(box){
    var last = box.lastElementChild;
    if (!last) return 0;
    return last.getBoundingClientRect().bottom -
           box.getBoundingClientRect().top;
  }

  document.querySelectorAll(".card").forEach(function (card){
    var body = card.querySelector(".body"), size = START;
    card.style.fontSize = size + "pt";
    while (size > FLOOR && used(body) > body.clientHeight * 0.98){
      size = Math.round((size - STEP) * 10) / 10;
      card.style.fontSize = size + "pt";
    }
    if (used(body) > body.clientHeight) tight = true;
  });
  if (tight){
    var note = document.createElement("p");
    note.className = "tight";
    note.textContent = "Конспект не влезает даже мелким шрифтом: "
      + "часть текста обрежется. Убери из подсказки лишний раздел — "
      + "в publish.json темы, ключ card.drop.";
    document.querySelector(".howto").appendChild(note);
  }
})();
</script>
