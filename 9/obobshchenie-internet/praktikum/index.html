  <h1>Интернет без ловушек</h1>

  <h2>Как сайт находится в сети</h2>
  <p>Имя сайта нужно людям, а компьютерам нужен номер — IP-адрес. На запрос

  <h2>Пять правил безопасности</h2>
  <ol>
    <li>Пароль не короче восьми знаков, с буквами и цифрами, и не имя с годом рождения.</li>
    <li>Код из смс не называть никому: ни «банку», ни «поддержке», ни другу.</li>
